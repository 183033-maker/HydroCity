<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HydroCity</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

h1{
margin-top:20px;
}

.city{
background:#1e293b;
height:200px;
margin:20px;
border-radius:10px;
position:relative;
overflow:hidden;
}

.person{
position:absolute;
font-size:24px;
}

.stats{
margin:10px;
}

.bar{
background:#334155;
height:20px;
border-radius:10px;
margin:5px auto;
width:300px;
overflow:hidden;
}

.fill{
height:100%;
text-align:center;
font-size:14px;
}

.water{background:#38bdf8;}
.people{background:#22c55e;}
.nature{background:#f97316;}

button{
padding:10px 20px;
margin:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#38bdf8;
}

</style>

</head>

<body>

<h1>💧 HydroCity</h1>

<h2>Día: <span id="day">1</span> / 10</h2>

<div class="stats">

Agua
<div class="bar"><div id="waterBar" class="fill water" style="width:50%">50</div></div>

Población
<div class="bar"><div id="peopleBar" class="fill people" style="width:50%">50</div></div>

Ambiente
<div class="bar"><div id="natureBar" class="fill nature" style="width:50%">50</div></div>

</div>

<div class="city" id="city"></div>

<p id="story">La ciudad enfrenta una fuerte sequía.</p>

<div id="choices"></div>

<script>

let water=50
let people=50
let nature=50
let day=1

function updateBars(){

document.getElementById("waterBar").style.width=water+"%"
document.getElementById("peopleBar").style.width=people+"%"
document.getElementById("natureBar").style.width=nature+"%"

document.getElementById("waterBar").innerText=water
document.getElementById("peopleBar").innerText=people
document.getElementById("natureBar").innerText=nature

}

function spawnCitizens(){

let city=document.getElementById("city")
city.innerHTML=""

for(let i=0;i<10;i++){

let p=document.createElement("div")
p.className="person"

let mood="🙂"

if(people<30) mood="😡"
if(people>70) mood="😃"

p.innerText=mood

p.style.left=Math.random()*90+"%"
p.style.top=Math.random()*80+"%"

city.appendChild(p)

}

}

const events=[

{
text:"La sequía empeora.",
choices:[
{text:"Racionar agua",effect:()=>{water+=10;people-=10}},
{text:"Construir recicladora",effect:()=>{water+=15;nature+=5;people-=5}},
{text:"Sacar agua del río",effect:()=>{water+=20;nature-=15}}
]
},

{
text:"Los agricultores necesitan agua.",
choices:[
{text:"Dar agua",effect:()=>{people+=5;water-=10}},
{text:"Negar agua",effect:()=>{people-=10}},
{text:"Importar comida",effect:()=>{people+=2}}
]
},

{
text:"Una fábrica quiere instalarse.",
choices:[
{text:"Aceptar",effect:()=>{people+=10;nature-=10}},
{text:"Rechazar",effect:()=>{nature+=5}},
{text:"Regular contaminación",effect:()=>{people+=5;nature-=3}}
]
}

]

function showEvent(){

if(day>10){

alert("🏆 Sobreviviste 10 días y salvaste HydroCity")
location.reload()
return

}

document.getElementById("day").innerText=day

let event=events[Math.floor(Math.random()*events.length)]

document.getElementById("story").innerText=event.text

let choicesDiv=document.getElementById("choices")
choicesDiv.innerHTML=""

event.choices.forEach(c=>{

let btn=document.createElement("button")
btn.innerText=c.text

btn.onclick=()=>{

c.effect()

limitStats()

day++

updateBars()
spawnCitizens()
checkGame()
showEvent()

}

choicesDiv.appendChild(btn)

})

}

function limitStats(){

water=Math.max(0,Math.min(100,water))
people=Math.max(0,Math.min(100,people))
nature=Math.max(0,Math.min(100,nature))

}

function checkGame(){

if(water<=0){
alert("💀 HydroCity se quedó sin agua")
location.reload()
}

if(people<=0){
alert("⚠️ La población abandonó la ciudad")
location.reload()
}

if(nature<=0){
alert("🌵 El ecosistema colapsó")
location.reload()
}

}

updateBars()
spawnCitizens()
showEvent()

</script>

</body>
</html>

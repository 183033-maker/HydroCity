<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HydroCity</title>

<style>

body{
font-family: Arial;
background:linear-gradient(#0f172a,#020617);
color:white;
text-align:center;
padding:40px;
}

h1{
font-size:40px;
}

.container{
max-width:700px;
margin:auto;
}

.bar{
background:#1e293b;
border-radius:20px;
margin:10px 0;
overflow:hidden;
}

.fill{
height:25px;
line-height:25px;
font-weight:bold;
}

#waterBar{background:#38bdf8;}
#peopleBar{background:#22c55e;}
#natureBar{background:#f97316;}

.scene{
font-size:70px;
margin:20px;
}

.story{
font-size:20px;
margin:20px;
min-height:70px;
}

button{
padding:15px 25px;
margin:10px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#38bdf8;
color:black;
transform:scale(1.05);
}

</style>

</head>

<body>

<h1>💧 HydroCity</h1>

<div class="container">

<div>Agua</div>
<div class="bar"><div id="waterBar" class="fill" style="width:50%">50</div></div>

<div>Población</div>
<div class="bar"><div id="peopleBar" class="fill" style="width:50%">50</div></div>

<div>Ambiente</div>
<div class="bar"><div id="natureBar" class="fill" style="width:50%">50</div></div>

<div class="scene" id="scene">🏙️</div>

<div class="story" id="story">
Una fuerte sequía golpea HydroCity. Debes tomar decisiones para salvar la ciudad.
</div>

<div id="choices"></div>

</div>

<script>

let water = 50
let people = 50
let nature = 50
let step = 0

const events = [

{
text:"La ciudad enfrenta una sequía severa.",
scene:"🏙️",
choices:[
{text:"Racionar agua",effect:()=>{water+=10;people-=10}},
{text:"Construir recicladora",effect:()=>{water+=15;nature+=10;people-=5}},
{text:"Tomar agua del río",effect:()=>{water+=20;nature-=15}}
]
},

{
text:"Los agricultores necesitan agua para los cultivos.",
scene:"🌾",
choices:[
{text:"Dar agua a agricultura",effect:()=>{people+=5;water-=10}},
{text:"Priorizar ciudad",effect:()=>{people-=5;water+=5}},
{text:"Importar comida",effect:()=>{water+=0;people+=2}}
]
},

{
text:"Una empresa quiere abrir una fábrica.",
scene:"🏭",
choices:[
{text:"Aceptar fábrica",effect:()=>{people+=10;nature-=10}},
{text:"Rechazar",effect:()=>{nature+=5}},
{text:"Aceptar con reglas ambientales",effect:()=>{people+=5;nature-=3}}
]
},

{
text:"Una lluvia inesperada llega a la región.",
scene:"🌧️",
choices:[
{text:"Recolectar lluvia",effect:()=>{water+=15}},
{text:"No hacer nada",effect:()=>{water+=5}},
{text:"Construir reservas",effect:()=>{water+=10;people-=3}}
]
},

{
text:"Los ciudadanos protestan por las decisiones del gobierno.",
scene:"😡",
choices:[
{text:"Escuchar protestas",effect:()=>{people+=5}},
{text:"Ignorar",effect:()=>{people-=10}},
{text:"Prometer mejoras",effect:()=>{people+=2}}
]
}

]

function updateBars(){

document.getElementById("waterBar").style.width = water+"%"
document.getElementById("peopleBar").style.width = people+"%"
document.getElementById("natureBar").style.width = nature+"%"

document.getElementById("waterBar").innerText = water
document.getElementById("peopleBar").innerText = people
document.getElementById("natureBar").innerText = nature

}

function showEvent(){

if(step >= events.length){

alert("🏆 Lograste mantener HydroCity con vida.")
location.reload()
return

}

let e = events[step]

document.getElementById("story").innerText = e.text
document.getElementById("scene").innerText = e.scene

let choicesDiv = document.getElementById("choices")
choicesDiv.innerHTML = ""

e.choices.forEach((c,i)=>{

let btn = document.createElement("button")
btn.innerText = c.text

btn.onclick = function(){

c.effect()

limitStats()
updateBars()
checkGame()

step++
showEvent()

}

choicesDiv.appendChild(btn)

})

}

function limitStats(){

water=Math.max(0,Math.min(100,water))
people=Math.max(0,Math.min(100,people))
nature=Math.max(0,Math.min(100,nature))

}

function checkGame(){

if(water<=0){
alert("💀 La ciudad se quedó sin agua.")
location.reload()
}

if(people<=0){
alert("⚠️ La población abandonó HydroCity.")
location.reload()
}

if(nature<=0){
alert("🌵 El ecosistema colapsó.")
location.reload()
}

}

updateBars()
showEvent()

</script>

</body>
</html>
